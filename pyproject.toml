[project]
name = "mcp-tasker"
version = "0.0.0"
description = "Simple file-based task tracker for git repos"
readme = "README.md"
license = {file = "LICENSE"}
urls = {repository = "https://github.com/greendwin/mcp-tasker"}
authors = [
    {name = "Evgeniy A. Cymbalyuk", email = "cimbaluk@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "typer-di>=0.1.0",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pydantic (>=2.0)",
    "mcp (>=1.26.0,<2.0.0)",
]

[project.scripts]
tasker = "tasker.main:app"

[[tool.poetry.packages]]
include = "tasker"
from = "src"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
tox = ">=4.0"
mypy = ">=1.10"
black = ">=24.0"
isort = ">=5.13"
flake8 = ">=7.0"
pyfakefs = ">=6.1"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.mypy]
strict = true
python_version = "3.10"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88


[tool.pytest.ini_options]
testpaths = ["tests"]
