[project]
name = "mcp-tasker"
version = "1.4.1"
description = "Markdown task tracker with MCP server for humans and AI agents, designed to live in git alongside code"
readme = "README.md"
license = {file = "LICENSE"}
urls = {repository = "https://github.com/greendwin/mcp-tasker"}
authors = [
    {name = "Evgeniy A. Cymbalyuk", email = "cimbaluk@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "typer-di>=0.1.0",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pydantic (>=2.0)",
    "mcp (>=1.26.0,<2.0.0)",
]

[project.scripts]
tasker = "tasker.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "tox>=4.0",
    "tox-uv>=1.16",
    "mypy>=1.10",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    "pyfakefs>=6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tasker"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
